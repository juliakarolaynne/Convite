<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirme | Aysha</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page rsvp-page">
    <div id="particles"></div>

    <header class="nav">
        <a class="brand" href="index.html">Aysha <span>♡</span></a>
        <span class="step">06 / 07</span>
    </header>

    <main class="screen">
        <div class="content">
            <p class="eyebrow">SERÁ UMA ALEGRIA</p>
            <h2>Você vem<br>para a <em>festa?</em></h2>
            <p>Confirme sua presença para fazer parte desse dia.</p>

            <form id="rsvpForm">
                <label>
                    Seu nome
                    <input id="name" type="text" required placeholder="Digite seu nome">
                </label>

                <label>
                    Quantas pessoas?
                    <select id="guests" required>
                        <option value="">Escolha</option>
                        <option>1 pessoa</option>
                        <option>2 pessoas</option>
                        <option>3 pessoas</option>
                        <option>4 pessoas</option>
                        <option>5 pessoas</option>
                    </select>
                </label>

                <label>
                    Uma mensagem <small>(opcional)</small>
                    <textarea id="message" rows="3" placeholder="Escreva algo para a Aysha"></textarea>
                </label>

                <button class="primary-btn" type="submit">Confirmar ♡</button>
            </form>

            <div id="confirmationScreen" class="confirmation-screen" hidden>
                <div class="confirmation-icon">✓</div>
                <p class="eyebrow">TUDO CERTO</p>
                <h2>Presença<br><em>confirmada!</em></h2>
                <p id="confirmationText">Obrigada por confirmar. Esperamos você para celebrar esse dia especial com a Aysha. 💗</p>
                <div class="confirmation-butterflies">🦋 ✦ 🦋</div>
                <a class="primary-btn" href="final.html">Continuar →</a>
            </div>

            <p id="result" class="result"></p>

            <nav class="bottom-nav">
                <a href="presentes.html">← Voltar</a>
                <a href="final.html">Final →</a>
            </nav>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
