<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Jardim | Aysha</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page garden-page">
    <div id="particles"></div>

    <header class="nav">
        <a class="brand" href="index.html">Aysha <span>♡</span></a>
        <span class="step">01 / 07</span>
    </header>

    <main class="screen">
        <div class="content">
            <div class="interactive-garden">
                <img class="garden-grass" src="assets/jardim/grama_sem_fundo.svg" alt="Grama do jardim">

                <button class="garden-flower f1" data-message="Um jardim cheio de carinho para celebrar a Aysha.">
                    <img src="assets/jardim/flor_1.svg" alt="Flor do jardim">
                </button>
                <button class="garden-flower f2" data-message="Um ano de descobertas, sorrisos e muito amor.">
                    <img src="assets/jardim/flor_2.svg" alt="Flor do jardim">
                </button>
                <button class="garden-flower f3" data-message="Cada pequeno detalhe foi preparado com carinho.">
                    <img src="assets/jardim/flor_3.svg" alt="Flor do jardim">
                </button>
                <button class="garden-flower f4" data-message="Que nunca faltem flores, sonhos e alegrias.">
                    <img src="assets/jardim/flor_4.svg" alt="Flor do jardim">
                </button>

                <span class="firefly firefly-one"></span>
                <span class="firefly firefly-two"></span>
                <span class="firefly firefly-three"></span>
            </div>

            <div id="flowerMessage" class="flower-message">
                toque nas flores para descobrir os encantos ✦
            </div>

            <p class="eyebrow">O JARDIM DA AYSHA</p>
            <h2>Um cantinho<br>feito de <em>amor</em></h2>
            <p>
                Hoje o nosso jardim está diferente.
                Há flores, borboletas e muitos motivos para sorrir.
            </p>
            <p class="script">Encontre os pequenos encantos...</p>

            <a class="primary-btn discover-history" href="historia.html">
                Descobrir a história →
            </a>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
