<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugestões de presente | Aysha</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page gifts-page">
    <div id="particles"></div>

    <header class="nav">
        <a class="brand" href="index.html">Aysha <span>♡</span></a>
        <span class="step">05 / 07</span>
    </header>

    <main class="screen">
        <div class="content gifts-content">
            <p class="eyebrow">COM CARINHO</p>
            <h2>Uma lembrança<br>para a <em>Aysha</em></h2>
            <p class="gift-intro">Se quiser presentear a nossa pequena, deixamos algumas sugestões:</p>

            <div class="gift-list">
                <button class="gift-option" data-gift="roupinhas">
                    <span class="gift-icon"><img src="assets/presentes/blusa.svg" alt="Roupinhas"></span>
                    <span><strong>Roupinhas</strong><small>Tamanho: 2 anos</small></span>
                </button>

                <button class="gift-option" data-gift="calcados">
                    <span class="gift-icon"><img src="assets/presentes/sapato.svg" alt="Calçados"></span>
                    <span><strong>Calçados</strong><small>Tamanho: 20</small></span>
                </button>

                <button class="gift-option" data-gift="brinquedos">
                    <span class="gift-icon"><img src="assets/presentes/brinquedo.svg" alt="Brinquedos"></span>
                    <span><strong>Brinquedos</strong><small>Brinquedos diversos</small></span>
                </button>

                <button class="gift-option gift-pix" data-gift="pix">
                    <span class="gift-icon"><img src="assets/presentes/pix.svg" alt="PIX"></span>
                    <span><strong>PIX</strong><small>Uma sugestão de presente</small></span>
                </button>
            </div>

            <div id="giftDetails" class="gift-details" hidden></div>

            <a class="primary-btn" href="rsvp.html">Confirmar presença →</a>

            <nav class="bottom-nav">
                <a href="local.html">← Voltar</a>
                <a href="rsvp.html">Próximo →</a>
            </nav>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
